name: Bootstrap PlanDan source

on:
  push:
    paths:
      - '.source.ready'

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Unpack final source
        run: |
          set -euo pipefail
          mkdir -p /tmp/plandan-final
          cat .source.part.* | base64 -d > /tmp/plandan-final.zip
          unzip -q /tmp/plandan-final.zip -d /tmp/plandan-final
          mkdir -p /tmp/plandan-final/public/icons /tmp/plandan-final/public/languages
          curl -fsSL https://plandan.lineaplusdev.com/icons/icon-64.png -o /tmp/plandan-final/public/icons/icon-64.png
          curl -fsSL https://plandan.lineaplusdev.com/icons/icon-192.png -o /tmp/plandan-final/public/icons/icon-192.png
          curl -fsSL https://plandan.lineaplusdev.com/icons/icon-512.png -o /tmp/plandan-final/public/icons/icon-512.png
          curl -fsSL https://plandan.lineaplusdev.com/icons/apple-touch-icon.png -o /tmp/plandan-final/public/icons/apple-touch-icon.png
          curl -fsSL https://plandan.lineaplusdev.com/languages/hr.png -o /tmp/plandan-final/public/languages/hr.png
          rsync -a --delete --exclude='.git' --exclude='.github/workflows/' /tmp/plandan-final/ ./
          rm -f .source.ready .source.part.*
      - name: Commit final v1.3.0 source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'PlanDan v1.3.0 final PWA' || exit 0
          git push origin HEAD:main
