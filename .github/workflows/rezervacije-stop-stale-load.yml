name: Stop Stale Rezervacije Docker Load

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rezervacije-stop-stale-load.yml'

permissions:
  contents: read

jobs:
  stop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Stop only abandoned docker load
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" 'bash -se' <<'EOF'
            set -e
            PIDS=$(ps -eo pid=,cmd= | awk '$2=="docker" && $3=="load" {print $1}')
            if [ -n "$PIDS" ]; then
              echo "Stopping stale docker load: $PIDS"
              kill $PIDS || true
              sleep 3
            fi
            docker image inspect lineaplus-rezervacije:latest >/dev/null
            echo 'IMAGE_OK=yes'
          EOF
