name: Inspect Rezervacije VPS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-rezervacije-vps.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Inspect current state
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" 'bash -se' <<'EOF'
            set +e
            date -Is
            echo '--- deploy processes ---'
            ps -eo pid,ppid,etime,cmd | grep -E 'docker|gunzip|rezervacije-image|prisma|tsx|web-push|git fetch|git reset' | grep -v grep || true
            echo '--- all containers ---'
            docker ps -a --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}\t{{.Command}}' || true
            echo '--- transfer file ---'
            ls -lh /tmp/rezervacije-image.tar.gz 2>/dev/null || true
            echo '--- docker image ---'
            docker images lineaplus-rezervacije --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}' || true
            echo '--- compose ---'
            cd /opt/rezervacije 2>/dev/null && docker compose ps -a || true
            echo '--- health ---'
            curl -fsS --max-time 3 http://127.0.0.1:3700/api/health || true
            echo
          EOF
