name: Inspect Rezervacije VPS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-rezervacije-vps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Inspect bootstrap state
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" 'bash -se' <<'EOF'
            set +e
            echo '--- target directory ---'
            ls -ld /opt/rezervacije 2>/dev/null || true
            test -d /opt/rezervacije/.git && echo 'GIT_REPO=yes' || echo 'GIT_REPO=no'
            test -f /opt/rezervacije/.env && echo 'ENV=yes' || echo 'ENV=no'
            test -f /opt/rezervacije/.initial-credentials && echo 'INITIAL_CREDENTIALS=yes' || echo 'INITIAL_CREDENTIALS=no'
            echo '--- image ---'
            docker image ls lineaplus-rezervacije:latest || true
            echo '--- containers ---'
            docker ps -a --filter 'name=rezervacije' --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
            echo '--- compose ---'
            if [ -f /opt/rezervacije/docker-compose.yml ]; then
              cd /opt/rezervacije
              docker compose ps || true
              echo '--- recent app logs ---'
              docker compose logs --tail=40 app 2>/dev/null || true
              echo '--- recent worker logs ---'
              docker compose logs --tail=20 worker 2>/dev/null || true
            fi
            echo '--- port ---'
            curl -fsS --max-time 3 http://127.0.0.1:3700/api/health || true
            echo
            ss -ltn 2>/dev/null | grep ':3700 ' || true
          EOF
