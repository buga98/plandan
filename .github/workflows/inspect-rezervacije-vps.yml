name: Inspect Rezervacije VPS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-rezervacije-vps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Inspect bootstrap state
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o ServerAliveInterval=30 -o ServerAliveCountMax=10 "$VPS_USER@$VPS_HOST" 'bash -se' <<'EOF'
            set +e
            date -Is
            echo '--- target ---'
            ls -ld /opt/rezervacije 2>/dev/null || true
            test -d /opt/rezervacije/.git && echo 'GIT_REPO=yes' || echo 'GIT_REPO=no'
            test -f /opt/rezervacije/.env && echo 'ENV=yes' || echo 'ENV=no'
            echo '--- transferred archive ---'
            ls -lh /tmp/rezervacije-image.tar.gz 2>/dev/null || echo 'ARCHIVE=missing'
            echo '--- load processes ---'
            ps -eo pid,etime,pcpu,pmem,cmd | grep -E 'docker load|gunzip -c /tmp/rezervacije-image' | grep -v grep || true
            echo '--- image ---'
            docker image ls lineaplus-rezervacije:latest || true
            echo '--- containers ---'
            docker ps -a --filter 'name=rezervacije' --format 'table {{.Names}}\t{{.Status}}\t{{.Ports}}' || true
            echo '--- port ---'
            curl -fsS --max-time 3 http://127.0.0.1:3700/api/health || true
            echo
          EOF
