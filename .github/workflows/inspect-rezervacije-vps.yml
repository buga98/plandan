name: Inspect Rezervacije VPS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-rezervacije-vps.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Inspect current state
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" 'bash -se' <<'EOF'
            set +e
            date -Is
            echo '--- relevant processes ---'
            ps -eo pid,ppid,etime,state,wchan:24,cmd | grep -E 'bash -se|sshd:|docker|gunzip|rezervacije-image|prisma|tsx|web-push|git fetch|git reset|git clean' | grep -v grep || true
            echo '--- repository ---'
            git -C /opt/rezervacije rev-parse HEAD 2>/dev/null || true
            git -C /opt/rezervacije status --short --branch 2>/dev/null || true
            find /opt/rezervacije/.git -maxdepth 1 -name '*.lock' -ls 2>/dev/null || true
            echo '--- image/file locks ---'
            command -v fuser >/dev/null && fuser -v /tmp/rezervacije-image.tar.gz 2>&1 || true
            echo '--- docker image ---'
            docker images lineaplus-rezervacije --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.Size}}' || true
            echo '--- reservation containers ---'
            docker ps -a --filter 'name=rezervacije' --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
            echo '--- compose ---'
            cd /opt/rezervacije 2>/dev/null && docker compose ps -a || true
            echo '--- health ---'
            curl -fsS --max-time 3 http://127.0.0.1:3700/api/health || true
            echo
          EOF
