name: Inspect Rezervacije VPS

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-rezervacije-vps.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Inspect current state
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" 'bash -se' <<'EOF'
            set +e
            date -Is
            echo '--- reservation containers ---'
            docker ps -a --filter 'name=rezervacije' --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
            CID=$(docker ps -q --filter 'name=rezervacije-app-run' | head -n1)
            if [ -n "$CID" ]; then
              echo '--- migration container logs ---'
              docker logs --tail=120 "$CID" 2>&1 || true
            fi
            echo '--- compose ---'
            cd /opt/rezervacije 2>/dev/null && docker compose ps || true
            echo '--- health ---'
            curl -fsS --max-time 3 http://127.0.0.1:3700/api/health || true
            echo
          EOF

# Triggered to inspect the live Rezervacije deployment state.
