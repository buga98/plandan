name: Probe VPS for Rezervacije

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-rezervacije-vps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Probe active deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          timeout 45s ssh "$VPS_USER@$VPS_HOST" 'bash -se' <<'EOF'
            set +e
            date -Is
            echo '--- relevant processes ---'
            ps -eo pid,ppid,etime,state,cmd --forest | grep -E 'bash -se|docker compose|docker run|prisma|rezervacije|npm run worker|next start' | grep -v grep || true
            echo '--- compose state ---'
            cd /opt/rezervacije 2>/dev/null && docker compose ps || true
            echo '--- app logs ---'
            cd /opt/rezervacije 2>/dev/null && docker compose logs --tail=40 app 2>&1 || true
            echo '--- worker logs ---'
            cd /opt/rezervacije 2>/dev/null && docker compose logs --tail=40 worker 2>&1 || true
            echo '--- health ---'
            curl -fsS --max-time 3 http://127.0.0.1:3700/api/health || true
            echo
          EOF

# Extended process probe for direct Rezervacije deployment verification.
