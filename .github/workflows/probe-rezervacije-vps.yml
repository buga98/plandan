name: Probe VPS for Rezervacije

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/probe-rezervacije-vps.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Probe active deployment
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          timeout 45s ssh "$VPS_USER@$VPS_HOST" 'bash -se' <<'EOF'
            set +e
            date -Is
            echo '--- processes ---'
            ps -eo pid,ppid,etime,state,cmd | grep -E 'rezervacije|prisma migrate|tsx prisma/seed|docker compose|docker run|git fetch|git reset' | grep -v grep || true
            echo '--- reservation containers ---'
            docker ps -a --filter 'name=rezervacije' --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
            echo '--- port ---'
            ss -ltnp 2>/dev/null | grep ':3700 ' || true
            echo '--- health ---'
            curl -fsS --max-time 2 http://127.0.0.1:3700/api/health || true
            echo
          EOF
