name: Deploy PlanDan to VPS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plandan-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" 'bash -se' <<'EOF'
            set -euo pipefail
            cd /opt/plandan

            if [ -x ./scripts/backup.sh ]; then
              ./scripts/backup.sh
            fi

            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            chmod +x scripts/*.sh

            npm_run_timezone_audit=false
            if command -v node >/dev/null 2>&1; then
              if node scripts/timezone-audit.mjs; then
                npm_run_timezone_audit=true
              fi
            fi
            echo "Timezone audit on host: $npm_run_timezone_audit"

            docker compose build app
            docker compose up -d --force-recreate app worker
            docker compose ps

            for i in {1..30}; do
              if curl -fsS http://127.0.0.1:3600/api/health >/tmp/plandan-health.json; then
                cat /tmp/plandan-health.json
                break
              fi
              if [ "$i" -eq 30 ]; then
                docker compose logs --tail=120 app worker
                exit 1
              fi
              sleep 3
            done

            # /app is the production entry point for the new local-first SPA.
            app_code=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:3600/app)
            case "$app_code" in
              200|302|303|307|308) ;;
              *) echo "Unexpected local /app status: $app_code"; exit 1 ;;
            esac
          EOF

      - name: Public health check
        run: |
          set -euo pipefail
          for i in {1..20}; do
            if curl -fsS https://plandan.lineaplusdev.com/api/health >/tmp/health.json; then
              app_code=$(curl -sS -o /dev/null -w '%{http_code}' https://plandan.lineaplusdev.com/app)
              case "$app_code" in
                200|302|303|307|308)
                  cat /tmp/health.json
                  echo "Public /app status: $app_code"
                  exit 0
                  ;;
              esac
            fi
            sleep 3
          done
          exit 1
