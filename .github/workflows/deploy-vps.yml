name: Deploy PlanDan to VPS

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plandan-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Deploy production
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh "$VPS_USER@$VPS_HOST" 'bash -se' <<'EOF'
            set -euo pipefail
            cd /opt/plandan

            if [ -x ./scripts/backup.sh ]; then
              ./scripts/backup.sh
            fi

            git fetch origin main
            git reset --hard origin/main
            git clean -fd
            chmod +x scripts/*.sh

            npm_run_timezone_audit=false
            if command -v node >/dev/null 2>&1; then
              if node scripts/timezone-audit.mjs; then
                npm_run_timezone_audit=true
              fi
            fi
            echo "Timezone audit on host: $npm_run_timezone_audit"

            # Build both pieces before switching traffic. The Next container is
            # API/auth only; the Nginx image contains the Vite SPA.
            docker compose build app web

            # First recreate the backend without the old host port, then start
            # the gateway on 127.0.0.1:3600. This keeps the Hestia template unchanged.
            docker compose up -d --force-recreate app
            docker compose up -d --force-recreate worker web
            docker compose ps

            for i in {1..40}; do
              if curl -LfsS http://127.0.0.1:3600/api/health >/tmp/plandan-health.json \
                && curl -LfsS http://127.0.0.1:3600/app/ >/tmp/plandan-app.html \
                && grep -q 'PlanDan' /tmp/plandan-app.html; then
                cat /tmp/plandan-health.json
                echo "Local direct SPA: OK"
                exit 0
              fi
              sleep 3
            done

            docker compose logs --tail=160 app web worker
            exit 1
          EOF

      - name: Public health check
        env:
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          base="https://plandan.lineaplusdev.com"
          for i in {1..30}; do
            health_code=$(curl -L -sS -o /tmp/health.json -w '%{http_code}' \
              -H 'Cache-Control: no-cache' \
              "$base/api/health?deploy=$DEPLOY_SHA" || true)
            app_code=$(curl -L -sS -o /tmp/app.html -w '%{http_code}' \
              -H 'Cache-Control: no-cache' \
              "$base/app/?deploy=$DEPLOY_SHA" || true)

            if [ "$health_code" = "200" ] \
              && [ "$app_code" = "200" ] \
              && grep -q 'PlanDan' /tmp/app.html; then
              cat /tmp/health.json
              echo "Public direct SPA: OK (health=$health_code app=$app_code)"
              exit 0
            fi

            echo "Public check attempt $i: health=$health_code app=$app_code"
            sleep 3
          done

          echo '--- health response ---'
          head -c 1000 /tmp/health.json 2>/dev/null || true
          echo
          echo '--- app response (first 2000 bytes) ---'
          head -c 2000 /tmp/app.html 2>/dev/null || true
          echo
          exit 1
