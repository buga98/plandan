name: Start Rezervacije Services

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rezervacije-start-services.yml'

permissions:
  contents: read

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Launch application services
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          ssh -o ServerAliveInterval=20 -o ServerAliveCountMax=30 "$VPS_USER@$VPS_HOST" 'bash -se' <<'EOF'
            set -Eeuo pipefail
            cd /opt/rezervacije
            test -f .env
            docker image inspect lineaplus-rezervacije:latest >/dev/null

            echo '[rezervacije] Removing completed one-shot containers'
            IDS=$(docker ps -aq --filter 'name=rezervacije-app-run' || true)
            if [ -n "$IDS" ]; then docker rm -f $IDS || true; fi

            echo '[rezervacije] Starting app and worker'
            docker compose up -d --no-build --remove-orphans

            echo '[rezervacije] Health check'
            for i in {1..50}; do
              if curl -fsS --max-time 3 http://127.0.0.1:3700/api/health > /tmp/rezervacije-health.json; then
                cat /tmp/rezervacije-health.json
                echo
                docker compose ps
                rm -f /tmp/rezervacije-image.tar.gz
                echo 'REZERVACIJE_LOCAL_OK=yes'
                exit 0
              fi
              sleep 3
            done

            docker compose ps -a
            docker compose logs --tail=200 app || true
            docker compose logs --tail=120 worker || true
            exit 1
          EOF
